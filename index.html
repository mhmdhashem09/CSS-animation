    <div class="wall" style="--x:6; --y:14; --w:1; --h:4"></div>
    <div class="wall" style="--x:2; --y:17; --w:2; --h:1"></div>
    <div class="wall" style="--x:2; --y:20; --w:3; --h:2"></div>
    <div class="wall" style="--x:6; --y:20; --w:3; --h:2"></div>

    <div class="wall" style="--x:11; --y:20; --w:3; --h:2"></div>

    <div class="wall house" style="--x:7; --y:10; --w:6; --h:3">48</div>

    <div class="ghost cyan"></div>
    <div class="ghost orange"></div>
    <div class="ghost purple"></div>

    <div class="pacman">
      <div class="half top"></div>
      <div class="half bottom"></div>
    </div>
  </div>
